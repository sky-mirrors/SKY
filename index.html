<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' http: https: ws: wss: blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <title>SKY 工作台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
    #app { width: 100%; height: 100%; }
    .init-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #050510; z-index: 9999; transition: opacity 0.5s; }
    .init-loader.fade { opacity: 0; pointer-events: none; }
    .init-loader .pulse { width: 12px; height: 12px; border-radius: 50%; background: #aaccff; animation: lpulse 1.5s ease-in-out infinite; }
    @keyframes lpulse { 0%,100% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1.2); opacity: 1; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="init-loader" id="initLoader">
      <div class="pulse"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
