name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Kernel purity check (M18)
        run: npx tsx scripts/purity-check.ts

      - name: Typecheck (soft gate, baseline 30 pre-existing errors)
        run: npm run typecheck
        continue-on-error: true
