<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY V9 · 正确信息架构（内核/能力层/领域包 三层 IA + 交互）</title>
<style>
  :root {
    --s0:#0b1020; --s1:#131a2e; --s2:#1a2340;
    --m0:#0f1526; --m1:#161d33; --m2:#1d2642;
    --ink:#dfe6ff; --sub:#7c86ad; --line:#232c4a;
    --gold:#e8b64c; --cyan:#5ad4e6; --ok:#7ee787; --warn:#f0a35e;
    --accent:#6c9bff; --mono:'Consolas',monospace; --r:6px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Microsoft YaHei',sans-serif; background:#1a1f33; }
  .app { width:1300px; max-width:100%; height:860px; margin:20px auto; border-radius:10px; overflow:hidden; display:flex; box-shadow:0 6px 30px rgba(0,0,0,.5); }

  /* ===== 侧栏：三层 IA ===== */
  .side { width:236px; background:var(--s0); color:var(--ink); display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
  .brand { padding:14px 16px 10px; font-size:15px; font-weight:800; }
  .brand .star { color:var(--gold); }
  .brand .s { font-size:9.5px; color:var(--sub); margin-top:1px; }
  .newtask { margin:0 12px 10px; padding:9px 12px; border:1px solid var(--line); border-radius:6px; background:var(--s1); font-size:12.5px; cursor:pointer; color:var(--ink); }
  .newtask:hover { border-color:var(--accent); }
  .grp { padding:8px 14px 3px; font-size:9.5px; letter-spacing:1px; color:var(--sub); font-weight:700; }
  .nav { display:flex; flex-direction:column; gap:1px; padding:0 10px; }
  .nav-i {
    padding:8px 10px; border-radius:6px; font-size:12.5px; cursor:pointer;
    color:var(--sub); display:flex; align-items:center; gap:9px;
  }
  .nav-i:hover { background:var(--s1); color:var(--ink); }
  .nav-i.active { background:var(--s2); color:var(--ink); }
  /* 无 emoji：CSS 形符 */
  .ico { width:14px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--sub); flex-shrink:0; }
  .nav-i.active .ico { color:var(--gold); }
  .nav-i .cnt { margin-left:auto; font-size:9px; color:var(--sub); font-family:var(--mono); }
  .nav-i .badge-on { margin-left:auto; font-size:8.5px; color:var(--ok); }
  .sub-list { padding:0 10px 2px; }
  .sub-i { padding:6px 10px 6px 33px; font-size:11.5px; color:var(--sub); cursor:pointer; border-radius:6px; display:flex; align-items:center; gap:7px; }
  .sub-i:hover { color:var(--ink); background:var(--s1); }
  .sub-i.active { color:var(--ink); background:var(--s2); }
  .ledger-sum { margin:auto 12px 8px; border:1px solid var(--line); border-radius:8px; background:var(--s1); padding:10px 12px; }
  .ledger-sum .big { font-family:var(--mono); font-size:22px; font-weight:700; color:var(--gold); }
  .ledger-sum .lbl { font-size:9.5px; color:var(--sub); }
  .ledger-sum .saved { font-family:var(--mono); font-size:13px; color:var(--ok); font-weight:700; margin-top:6px; }
  .userrow {
    margin:0 12px 10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px;
  }
  .userrow:hover { background:var(--s1); }
  .avatar { width:22px; height:22px; border-radius:50%; background:var(--gold); color:#0b1020; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; }
  .userrow .st { font-size:9px; color:var(--ok); }

  /* ===== 主区 ===== */
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--m0); color:var(--ink); min-width:0; }
  .mh { padding:10px 20px; border-bottom:1px solid var(--line); background:var(--m1); display:flex; align-items:center; gap:10px; }
  .mh .t { font-size:14px; font-weight:600; }
  .mh .crumb { font-size:11px; color:var(--sub); }
  .mh .crumb a { color:var(--cyan); cursor:pointer; }
  .mh .crumb b { color:var(--ink); }
  .spacer { flex:1; }
  .body { flex:1; display:flex; overflow:hidden; }
  .content { flex:1; overflow-y:auto; padding:16px 22px; min-width:0; }

  /* 右侧上下文面板（填右半） */
  .ctx {
    width:300px; border-left:1px solid var(--line); background:var(--m1);
    overflow-y:auto; padding:14px 16px; flex-shrink:0;
  }
  .ctx h5 { font-size:10.5px; color:var(--sub); letter-spacing:.5px; margin:14px 0 8px; font-weight:700; }
  .ctx h5:first-child { margin-top:0; }
  .tl-i { font-family:var(--mono); font-size:10.5px; padding:5px 0 5px 9px; border-left:2px solid var(--accent); margin-bottom:5px; color:var(--ink); }
  .tl-i .t { color:var(--sub); font-size:9.5px; }
  .tl-i.block { border-left-color:var(--warn); color:var(--warn); }
  .kv { display:flex; justify-content:space-between; font-size:11.5px; padding:4px 0; border-bottom:1px dashed var(--line); }
  .kv .k { color:var(--sub); } .kv .v { font-family:var(--mono); }
  .sw-row { display:flex; justify-content:space-between; align-items:center; font-size:11.5px; padding:5px 0; }
  .sw { font-size:10px; padding:1px 8px; border-radius:8px; }
  .sw.on { color:var(--ok); background:rgba(126,231,135,.12); }
  .sw.off { color:var(--sub); background:var(--line); }

  /* 对话 */
  .msgs { flex:1; overflow-y:auto; padding:16px 22px; }
  .m { margin-bottom:14px; max-width:680px; }
  .m .who { font-size:10px; color:var(--sub); margin-bottom:3px; font-family:var(--mono); }
  .m .who .layer { color:var(--gold); }
  .m.user .text { display:inline-block; padding:8px 12px; border-radius:8px; background:var(--m2); border:1px solid var(--line); font-size:12.5px; }
  .m .text { font-size:12.5px; line-height:1.7; }
  .m .art { margin-top:6px; font-size:10.5px; color:var(--ok); font-family:var(--mono); }
  .gates { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .gt { font-size:9.5px; padding:2px 8px; border-radius:8px; }
  .gt.pass { background:rgba(126,231,135,.12); color:var(--ok); }
  .gt.save { background:rgba(90,212,230,.12); color:var(--cyan); }
  .composer { display:flex; gap:8px; padding:12px 22px; border-top:1px solid var(--line); }
  .composer input { flex:1; padding:10px 12px; font-size:12.5px; background:var(--m2); border:1px solid var(--line); border-radius:var(--r); color:var(--ink); }
  .composer button { padding:10px 22px; background:var(--accent); color:#fff; border:none; border-radius:var(--r); font-weight:600; cursor:pointer; }

  /* 思考动态（routing 动画） */
  .thinking {
    border:1px solid var(--line); border-radius:var(--r); background:var(--m1);
    padding:10px 14px; margin-bottom:14px; font-family:var(--mono); font-size:11.5px;
  }
  .thinking .step { display:flex; align-items:center; gap:8px; padding:3px 0; color:var(--sub); }
  .thinking .step.done { color:var(--ink); }
  .thinking .step .mark { width:14px; text-align:center; }
  .thinking .step .mark.ok { color:var(--ok); }
  .thinking .step.run .mark { color:var(--gold); }
  @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  .pulse { animation:pulse 1.1s infinite; }
  .dots::after { content:"…"; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content:""; } 25% { content:"·"; } 50% { content:"··"; } 75% { content:"···"; } }

  /* 表单/设置 */
  .set-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); }
  .set-row .l { font-size:12.5px; }
  .set-row .l .d { font-size:10.5px; color:var(--sub); margin-top:2px; }
  .set-row input[type=text], .set-row input[type=password] {
    width:280px; padding:7px 10px; font-family:var(--mono); font-size:12px;
    background:var(--m2); border:1px solid var(--line); border-radius:var(--r); color:var(--ink);
  }
  .swbtn { font-size:10.5px; padding:3px 12px; border-radius:8px; cursor:pointer; border:none; }
  .swbtn.on { background:rgba(126,231,135,.15); color:var(--ok); }
  .swbtn.off { background:var(--m2); color:var(--sub); }
  .card { border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-bottom:10px; background:var(--m1); }
  .card .t { font-size:13px; font-weight:600; margin-bottom:2px; }
  .card .d { font-size:11px; color:var(--sub); line-height:1.55; }
  .cards { display:flex; gap:10px; flex-wrap:wrap; }
  .field { margin-bottom:10px; }
  .field label { font-size:10.5px; color:var(--sub); display:block; margin-bottom:4px; }
  .field textarea { width:100%; min-height:40px; padding:8px; font-family:var(--mono); font-size:13px; background:var(--m2); border:1px solid var(--line); border-radius:var(--r); color:var(--ink); }
  .btn { padding:7px 18px; background:var(--accent); color:#fff; border:none; border-radius:var(--r); cursor:pointer; font-weight:600; font-size:12.5px; }
  .btn.s { background:var(--m2); color:var(--ink); border:1px solid var(--line); font-weight:400; }
  .gate { font-size:9px; padding:1px 7px; border-radius:3px; font-weight:700; }
  .gate.fg { background:rgba(126,231,135,.12); color:var(--ok); }
  .gate.sm { background:rgba(108,155,255,.12); color:var(--accent); }
  .gate.aa { background:rgba(240,163,94,.12); color:var(--warn); }
  .gate.ka { background:rgba(90,212,230,.12); color:var(--cyan); }
  .statusbar { display:flex; align-items:center; border-top:1px solid var(--line); background:var(--m1); font-size:10.5px; color:var(--sub); height:24px; }
  .sb-i { padding:0 10px; height:100%; display:flex; align-items:center; gap:4px; border-right:1px solid var(--line); }
  .sb-i .num { font-family:var(--mono); color:var(--ink); }
  .sb-i.right { margin-left:auto; border-right:none; border-left:1px solid var(--line); }
  .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .dot.ok { background:var(--ok); } .dot.off { background:var(--line); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <!-- ===== 侧栏：三层 IA ===== -->
  <aside class="side">
    <div class="brand">SKY<span class="star"> ✦</span><div class="s">成本账本 · 路由全可见 · fail-closed</div></div>
    <div class="newtask">＋ 新建任务</div>

    <div class="grp">主控</div>
    <nav class="nav">
      <div class="nav-i active" data-v="chat" onclick="go('chat')"><span class="ico">▣</span> 对话</div>
    </nav>

    <div class="grp">内核机制</div>
    <nav class="nav">
      <div class="nav-i" data-v="routes" onclick="go('routes')"><span class="ico">◈</span> 路由决策</div>
      <div class="nav-i" data-v="settings" onclick="go('settings')"><span class="ico">⚙</span> 设置</div>
    </nav>

    <div class="grp">能力层（所有域共享）</div>
    <nav class="nav">
      <div class="nav-i" data-v="kb" onclick="go('kb')"><span class="ico">▤</span> 知识库</div>
      <div class="nav-i" onclick="go('mcp')"><span class="ico">◇</span> MCP 服务 <span class="cnt">5</span></div>
      <div class="nav-i" onclick="go('skills')"><span class="ico">◇</span> 技能库 <span class="cnt">21</span></div>
    </nav>

    <div class="grp">领域包（挂载 2）</div>
    <nav class="nav">
      <div class="nav-i" data-v="chem" onclick="go('chem')"><span class="ico">◆</span> 化学与化工 <span class="badge-on">挂载</span></div>
      <div class="nav-i" data-v="paper" onclick="go('paper')"><span class="ico">◆</span> 科学研究 <span class="badge-on">挂载</span></div>
      <div class="sub-list"><div class="sub-i" style="opacity:.45;cursor:default;">财务与法务 · 未装</div></div>
    </nav>

    <div class="ledger-sum">
      <div class="big">¥0.42</div>
      <div class="lbl">本月 LLM 实付</div>
      <div class="saved">↓ 已省 ¥3.86</div>
    </div>
    <div class="userrow" onclick="go('account')">
      <span class="avatar">A</span>
      <span>Administrator</span>
      <span style="margin-left:auto;" class="st">● 本机</span>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <div class="main">
    <div class="mh">
      <span class="t" id="mh-t">对话</span>
      <span class="crumb" id="mh-c"></span>
      <span class="spacer"></span>
      <span class="engine">GLM 在线</span>
    </div>
    <div class="body">
      <div class="content" id="content"></div>
      <div class="ctx" id="ctx"></div>
    </div>
    <div class="statusbar">
      <div class="sb-i"><span class="dot ok"></span> 引擎在线</div>
      <div class="sb-i">本次 <span class="num">620</span> tok</div>
      <div class="sb-i">确定性 <span class="num">2/3</span></div>
      <div class="sb-i">产物 <span class="num">3</span></div>
      <div class="sb-i right"><span class="dot off"></span> Origin COM</div>
      <div class="sb-i right"><span class="dot off"></span> ChemDraw COM</div>
    </div>
  </div>
</div>

<script>
const content = document.getElementById('content');
const ctxEl = document.getElementById('ctx');
const mhT = document.getElementById('mh-t');
const mhC = document.getElementById('mh-c');

function go(v) {
  document.querySelectorAll('.nav-i').forEach(e => e.classList.toggle('active', e.dataset.v === v));
  render[v]();
}

const ctxChat = `
  <h5>路由时间线（本会话）</h5>
  <div class="tl-i"><span class="t">14:02 · </span>L2 任务书 → 周报 3 步</div>
  <div class="tl-i"><span class="t">13:58 · </span>smiles_info → 本地解析</div>
  <div class="tl-i block"><span class="t">13:58 · </span>FactGuard BLOCK 差 90%</div>
  <h5>驯化闸门</h5>
  <div class="sw-row"><span>FactGuard 事实校验</span><span class="sw on">启用</span></div>
  <div class="sw-row"><span>引用锚点</span><span class="sw on">启用</span></div>
  <div class="sw-row"><span>LlmPolicy 禁词/必含</span><span class="sw on">启用</span></div>
  <h5>产物（.sky-output）</h5>
  <div class="kv"><span class="k">周报草稿.docx</span><span class="v">18.9 KB</span></div>
  <div class="kv"><span class="k">光谱图.png</span><span class="v">242 KB</span></div>`;

const render = {
  chat() {
    mhT.textContent = '对话';
    mhC.innerHTML = '';
    ctxEl.innerHTML = ctxChat;
    content.innerHTML = `
      <div class="cards" style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <div class="card" style="cursor:pointer;" onclick="go('chem')"><div class="t">化学结构验证</div><div class="d">化学与化工包 · 0 token · 机器验证</div></div>
        <div class="card" style="cursor:pointer;" onclick="go('paper')"><div class="t">论文精读</div><div class="d">科学研究包 · 动作缓存</div></div>
        <div class="card" style="cursor:pointer;" onclick="go('mcp')"><div class="t">数据 → Origin</div><div class="d">MCP/COM 桥 · 导入导出</div></div>
      </div>
      <div id="msgs">
        <div class="m user"><div class="who">你</div><div class="text">把桌面上的实验数据.csv 摘要成周报</div></div>
        <div class="m"><div class="who">SKY · <span class="layer">L2 任务书命中</span> · 3 步 · LLM 1 次</div>
          <div class="text">已从任务书「周报自动草稿」展开执行：读目录 → 读文件 → 生成周报。FactGuard 与源数据比对：0 冲突。</div>
          <div class="art">📎 .sky-output/周报草稿.docx (18.9 KB)</div>
          <div class="gates"><span class="gt pass">FactGuard ✓</span><span class="gt pass">引用锚点 ✓</span><span class="gt pass">LlmPolicy ✓</span><span class="gt save">下次同任务 0 tok</span></div>
        </div>
      </div>
      <div id="think"></div>
      <div class="composer" style="padding:12px 0 0;">
        <input id="chat-in" style="flex:1;padding:10px 12px;font-size:12.5px;background:var(--m2);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);" placeholder="描述你的任务——SKY 会先决定能不能不花 token">
        <button class="btn" onclick="sendChat()">发送</button>
      </div>`;
    const inp = document.getElementById('chat-in');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) sendChat(); });
  },

  routes() {
    mhT.textContent = '路由决策（内核机制）';
    mhC.innerHTML = '每次请求的漏斗轨迹 · 成本与信任的账本';
    ctxEl.innerHTML = ctxChat;
    content.innerHTML = `
      <div class="flayer" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--m1);opacity:.4;"><span style="font-family:var(--mono);font-size:11px;min-width:90px;color:var(--sub);">L0 规则</span><span style="font-size:11.5px;flex:1;">12 条内置规则未命中「摘要成周报」</span><span style="font-family:var(--mono);font-size:10.5px;">—</span></div>
      <div class="flayer" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--m1);opacity:.4;"><span style="font-family:var(--mono);font-size:11px;min-width:90px;color:var(--sub);">L0.5 快配</span><span style="font-size:11.5px;flex:1;">关键词比率 0.2 &lt; 0.34 未过门</span><span style="font-family:var(--mono);font-size:10.5px;">—</span></div>
      <div class="flayer" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--m1);opacity:.4;"><span style="font-family:var(--mono);font-size:11px;min-width:90px;color:var(--sub);">L1 直调</span><span style="font-size:11.5px;flex:1;">6 条直调规则未命中</span><span style="font-family:var(--mono);font-size:10.5px;">—</span></div>
      <div class="flayer" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--gold);border-left:3px solid var(--gold);border-radius:var(--r);margin-bottom:6px;background:rgba(232,182,76,.06);"><span style="font-family:var(--mono);font-size:11px;min-width:90px;color:var(--gold);font-weight:700;">L2 任务书</span><span style="font-size:11.5px;flex:1;">「周报自动草稿」命中（关键词 3/5 ≥ 0.34）</span><span style="font-family:var(--mono);font-size:10.5px;color:var(--ok);">0 token</span></div>
      <div class="flayer" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--m1);opacity:.4;"><span style="font-family:var(--mono);font-size:11px;min-width:90px;color:var(--sub);">L3 仲裁</span><span style="font-size:11.5px;flex:1;">唯一候选，无需 LLM 仲裁</span><span style="font-family:var(--mono);font-size:10.5px;">—</span></div>
      <div class="flayer" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--m1);opacity:.4;"><span style="font-family:var(--mono);font-size:11px;min-width:90px;color:var(--sub);">L4 探索</span><span style="font-size:11.5px;flex:1;">未触发</span><span style="font-family:var(--mono);font-size:10.5px;">—</span></div>
      <div class="explain" style="padding:12px 14px;background:var(--m1);border-radius:var(--r);font-size:11.5px;line-height:1.8;margin-top:10px;">
        执行：3 步 DAG（<b>directory_tree → read_file → llm_generate</b>）· LLM 调用 <b>1 次</b>（约 620 tok）· 确定性步骤 <b>2 次（0 tok）</b><br>
        驯化：FactGuard <b>通过</b> · 引用锚点 <b>命中</b> · LlmPolicy <b>通过</b> · 下次同输入 <b>0 tok</b>
      </div>`;
  },

  settings() {
    mhT.textContent = '设置';
    mhC.innerHTML = '';
    ctxEl.innerHTML = '<h5>提示</h5><div style="font-size:11.5px;color:var(--sub);line-height:1.7;">设置即驯化：闸门开关、密钥、领域策略都在这里收口。fail-closed——拿不准的默认拒绝。</div>';

// ===== 化学解析器（JS 版，与 Rust smiles_info 同语义） =====
const MASS = { H:1.008,B:10.81,C:12.011,N:14.007,O:15.999,F:18.998,P:30.974,S:32.06,Cl:35.45,Br:79.904,I:126.904 };
const VALE = { C:4,N:3,P:3,B:3,O:2,S:2,F:1,Cl:1,Br:1,I:1 };
function parseSmiles(s) {
  const cs = [...s.trim()];
  if (!cs.length) throw new Error('SMILES 为空');
  const atoms = [], bonds = [], branch = [], tail = [], ring = {};
  let bo = 0, depth = 0, i = 0;
  while (i < cs.length) {
    const c = cs[i];
    if (c === '(') { if (tail.length) branch.push(tail[tail.length-1]); depth++; i++; continue; }
    if (c === ')') { depth--; if (depth < 0) throw new Error(`括号不匹配（位置 ${i}）`); if (branch.length) tail.push(branch.pop()); i++; continue; }
    if (c === '.') { tail.pop(); i++; continue; }
    if (/[0-9]/.test(c)) { bo = 1; i++; continue; }
    if ('=#-/\\'.includes(c)) { bo = c === '=' ? 2 : c === '#' ? 3 : 1; i++; continue; }
    const two = cs.slice(i, i+2).join('');
    let el = (i+1 < cs.length && MASS[two] !== undefined) ? two : (MASS[c] !== undefined ? c : null);
    if (!el) throw new Error(`不支持的原子/形态「${c}」（位置 ${i}）`);
    const idx = atoms.length; atoms.push(el);
    if (tail.length) bonds.push([tail[tail.length-1], idx, bo || 1]);
    bo = 0;
    if (tail.length) tail[tail.length-1] = idx; else tail.push(idx);
    i += el.length;
  }
  if (depth !== 0) throw new Error('括号不匹配（未闭合）');
  if (!atoms.length) throw new Error('未解析出原子');
  const used = new Array(atoms.length).fill(0);
  for (const [a,b,o] of bonds) { used[a] += o; used[b] += o; }
  const counts = {}; let h = 0;
  atoms.forEach((el, idx) => {
    h += Math.max(0, (VALE[el] || 0) - used[idx]);
    counts[el] = (counts[el] || 0) + 1;
  });
  if (h > 0) counts.H = (counts.H || 0) + h;
  const order = Object.keys(counts).sort((a,b) => {
    const r = e => e === 'C' ? 0 : e === 'H' ? 1 : 2;
    return r(a) - r(b) || a.localeCompare(b);
  });
  const formula = order.map(e => e + (counts[e] > 1 ? counts[e] : '')).join('');
  let mw = 0; let n = 0;
  for (const [el, c] of Object.entries(counts)) { mw += MASS[el] * c; n += c; }
  return { formula, mw: Math.round(mw*100)/100, atoms: n };
}
function liveParse() {
  const v = document.getElementById('chem-in').value;
  const out = document.getElementById('chem-out');
  try {
    const r = parseSmiles(v);
    out.innerHTML = `<div class="readout">
      <div class="status"><span class="vd">✓ 机器验证通过</span><span class="src">· 本地解析器（非 LLM）</span>
        <span style="margin-left:auto;" class="gate fg">FactGuard ✓</span><span class="gate sm">锚点 ✓</span></div>
      <div class="formula">${r.formula}</div>
      <div class="substats" style="display:flex;gap:20px;margin-top:8px;">
        <div class="st"><div class="n">${r.mw} g/mol</div><div class="l">分子量</div></div>
        <div class="st"><div class="n">${r.atoms}</div><div class="l">原子数</div></div>
        <div class="st"><div class="n" style="color:var(--cyan);">0</div><div class="l">token</div></div>
      </div></div>`;
  } catch (e) {
    out.innerHTML = `<div class="readout"><div style="color:var(--warn);font-size:12px;font-weight:600;">⚠ 幻觉拦截 / 解析失败</div>
      <div style="font-size:11.5px;color:var(--sub);margin-top:4px;">${e.message}——解析失败即幻觉，不被采信。</div></div>`;
  }
}
